<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153b42">
  <meta name="description" content="یک آشنایی کوتاه و تعاملی با اقتصاد مشارکتی و درخواست مشاوره.">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://sahm-hamdeli.amirzaee123.chatgpt.site; media-src 'self' https://sahm-hamdeli.amirzaee123.chatgpt.site; connect-src 'self' https://sahm-hamdeli.amirzaee123.chatgpt.site; form-action 'self'; upgrade-insecure-requests">
  <title>سهم تو کجاست؟ | همدلی</title>
  <link rel="preload" href="fonts/Vazirmatn-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css?v=17">
  <script src="app.js?v=17" defer></script>
</head>
<body>
  <main class="experience">
    <audio id="voice" preload="none"></audio>
    <audio id="music" preload="none"></audio>
    <div class="visual" aria-hidden="true">
      <div class="video-layer">
        <video id="film" class="cinema" muted playsinline preload="none"></video>
        <div id="clock" class="clock-card hidden"><span>ساعت</span><b>۱۱:۴۷</b></div>
        <div id="message" class="message-card hidden"><span class="message-dot"></span>همونی که گفتی رو گرفتم…<br><b>عالی بود.</b></div>
        <div id="motion-type" class="type-direction hidden"><span></span><b></b><em></em><i></i></div>
      </div>
      <div class="shade"></div><div class="light"></div><div class="grain"></div>
    </div>
    <header><span class="brand">همدلی<span>یک پیام، یک سؤال، یک مسیر تازه</span></span><span class="duration">۶ بخش · پخش پیوسته</span></header>
    <div class="chapter-line" aria-hidden="true"><i id="progress"></i></div>
    <noscript><div class="error" role="alert">برای اجرای این تجربه، جاوااسکریپت مرورگر را فعال کن.</div></noscript>
    <section id="stage" class="stage" aria-label="تجربه تعاملی همدلی" aria-live="polite" aria-atomic="true"></section>
    <div id="error" class="error hidden" role="alert"></div>
    <footer><small>ویدئوهای نمایشی با هوش مصنوعی تولید شده‌اند.</small></footer>
  </main>
</body>
</html>
